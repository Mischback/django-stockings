version = 1

# Source code without in-file statements
#
# There might be various reasons for this, but most likely those additional
# comments are not includable or it is not desired to include them (i.e. to
# optimize bandwith).
[[annotations]]
path = [
  "README.md",
  "stockings/templates/stockings/**/*.html",
]
SPDX-FileCopyrightText = "2026 Mischback"
SPDX-License-Identifier = "MIT"
SPDX-FileType = "SOURCE"

# Source code files that are automatically generated
#
# In the context of this project, this includes the automatically generated
# migrations of Django's ORM.
#
# Please note: This project contains *some* manually created migrations to add
# some initial data.
# [[annotations]]
# path = [
# ]
# SPDX-FileCopyrightText = "NONE"
# SPDX-License-Identifier = "CC0-1.0"
# SPDX-FileType = "SOURCE"

# Config files with actual contribution
[[annotations]]
path = [
  ".editorconfig",
  ".flake8",
  ".pre-commit-config.yaml",
  "pyproject.toml",
  "requirements/*.in"
]
SPDX-FileCopyrightText = "2026 Mischback"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileType = "OTHER"

# Config files/artifacts without actual contribution (mostly automatically
# generated files or not meeting a minimal threshold of originality)
[[annotations]]
path = [
  ".gitignore",
  "requirements/*.txt",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileType = "OTHER"
